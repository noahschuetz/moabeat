<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moabeat</title>
  <style>
    html, body { height: 100%; margin: 0; }
    object { width: 100%; height: 100%; border: none; }
    .fallback {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 30rem;
      margin: 4rem auto;
      padding: 0 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <object data="moabeat.pdf" type="application/pdf">
    <p class="fallback">
      Your browser can't display the PDF inline.
      <a href="moabeat.pdf">Open it directly</a> instead.
    </p>
  </object>
</body>
</html>
